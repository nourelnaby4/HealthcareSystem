name: Automation CI/CD

on:
  push:
    branches: [ "main", "master", "production" ]
  pull_request:
    branches: [ "main", "master", "production" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v5

    - name: Initialize CodeQL Security Scan
      uses: github/codeql-action/init@v3
      with:
        languages: 'csharp'

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Verify Code Formatting
      run: dotnet format HealthcareSystem.slnx --verify-no-changes

    - name: Restore dependencies
      run: dotnet restore HealthcareSystem.slnx

    - name: Check NuGet Vulnerabilities
      run: dotnet list HealthcareSystem.slnx package --vulnerable --include-transitive

    - name: Build
      run: dotnet build HealthcareSystem.slnx --no-restore --configuration Release

    - name: Test with Coverage
      run: dotnet test HealthcareSystem.slnx --no-build --configuration Release /p:CollectCoverage=true /p:CoverletOutputFormat=opencover --verbosity normal

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/healthcare-web
    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/healthcare-web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Test
      env:
        CI: true
      run: |
        if find src -name '*.spec.ts' | grep -q .; then
          npm test -- --watch=false
        fi

  push-to-dockerhub:
    needs: [build-and-test, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: backend/src/Bootstrapper/Healthcare.Api/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/healthcare-api:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/healthcare-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-to-render:
    needs: push-to-dockerhub
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Render Deploy Webhook
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
