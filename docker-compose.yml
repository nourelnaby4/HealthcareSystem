services:
  postgres:
    image: postgres:16-alpine
    container_name: healthcare-pg
    environment:
      POSTGRES_DB: healthcare
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: healthcare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare -d healthcare"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/src/Bootstrapper/Healthcare.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Healthcare: Host=postgres;Database=healthcare;Username=healthcare;Password=healthcare;Include Error Detail=true
      Bootstrap__UserName: admin
      Bootstrap__Email: admin@healthcare.local
      Bootstrap__Password: "Boot-Str@p123!"
      Jwt__Issuer: healthcare-api
      Jwt__Audience: healthcare-web
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "7"
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/healthcare-web/Dockerfile
    environment:
      API_BASE_URL: http://localhost:5080
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
